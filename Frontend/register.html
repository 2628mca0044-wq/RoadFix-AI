<!DOCTYPE html>
<html>
<head>
    <title>Register - RoadFix AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #0b3d91;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            color: #0b3d91;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background-color: #0b3d91;
            color: white;
            border: none;
            cursor: pointer;
        }

        .login {
            text-align: center;
        }

        a {
            color: #0b3d91;
            text-decoration: none;
        }

        #message {
            font-size: 14px;
        }

        footer {
            background-color: #0b3d91;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <header>

        <h2>RoadFix AI</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <div class="container">

        <h2>Create Account</h2>

        <form onsubmit="registerUser(event)">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>


            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <p id="message"></p>


            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" required>


            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required>


            <label>Address</label>
            <textarea id="address" placeholder="Enter your address" required></textarea>


            <button type="submit">Create Account</button>

        </form>


        <p class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>


    <footer>
        <p>© 2026 RoadFix AI | Civic Issue Reporting & Tracking Platform</p>
    </footer>


    <script>

        function registerUser(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value.toLowerCase();
            let mobile = document.getElementById("mobile").value;
            let password = document.getElementById("password").value;
            let address = document.getElementById("address").value;

            let role = "";

            let staffEmails = [
                "staff1@roadfix.com",
                "staff2@roadfix.com",
                "staff3@roadfix.com"
            ];

            if (email.endsWith("@gmail.com")) {

                role = "citizen";

            }
            else if (staffEmails.includes(email)) {

                role = "staff";

            }
            else if (email == "admin@roadfix.com") {

                role = "admin";

            }
            else {

                document.getElementById("message").innerHTML =
                    "Please use an authorized email address.";

                document.getElementById("message").style.color = "red";

                return;
            }


            localStorage.setItem("userName", name);
            localStorage.setItem("userEmail", email);
            localStorage.setItem("userMobile", mobile);
            localStorage.setItem("userPassword", password);
            localStorage.setItem("userAddress", address);
            localStorage.setItem("userRole", role);


            alert("Registration successful!");

            window.location.href = "login.html";
        }

    </script>

</body>
</html>
